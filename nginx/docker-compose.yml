services:
  nginx:
    image: nginx:alpine
    container_name: nginx-server
    extra_hosts:
      - "host.docker.internal:host-gateway" # This maps the name to the host IP
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - wordpress_wp_data:/var/www/html
      - ./conf:/etc/nginx/conf.d
      - certbot_data:/etc/letsencrypt
    networks:
      - wordpress_net
      - monitoring_net

  certbot:
    image: certbot/dns-cloudflare
    container_name: certbot-cloudflare
    volumes:
      - certbot_data:/etc/letsencrypt
      - ./cloudflare.ini:/etc/letsencrypt/cloudflare.ini:ro
    networks:
      - wordpress_net
      - monitoring_net

volumes:
  certbot_data:
  wordpress_wp_data:
    external: true
    name: wordpress_wp_data

networks:
  wordpress_net:
    external: true
    name: wordpress_default

  monitoring_net:
    external: true
    name: monitoring_default


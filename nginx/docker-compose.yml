services:
  nginx:
    image: nginx:alpine
    container_name: nginx-server
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - wordpress_wp_data:/var/www/html
      - ./nginx:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - wordpress_net
      - monitoring_net

  certbot:
    image: certbot/dns-cloudflare
    container_name: certbot-cloudflare
    volumes:
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - wordpress_net
      - monitoring_net

volumes:
  wordpress_wp_data:
    external: true
    name: wordpress_wp_data

networks:
  wordpress_net:
    external: true
    name: wordpress_default

  monitoring_net:
    external: true
    name: monitoring_default


server {
    listen 80;
    server_name jithendar.com www.jithendar.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name jithendar.com www.jithendar.com;

    ssl_certificate /etc/letsencrypt/live/jithendar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jithendar.com/privkey.pem;

    root /var/www/html;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass wordpress:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # n8n reverse proxy (CORRECT LOCATION)
    location /n8n/ {
        # Note the trailing slash at the end of the upstream URL
        proxy_pass http://n8n:5678/; 
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support (Crucial for n8n execution UI)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Increase buffers for large payloads
        proxy_buffering off;
        client_max_body_size 50M;
    }

    location /grafana/ {
        proxy_set_header Host $http_host; # Crucial: tells Grafana the real domain
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://grafana:3000; 
        # Keep WebSocket support for Grafana Live
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /prometheus/ {
        proxy_pass http://prometheus:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        client_max_body_size 50M;
    }

    location /manage/ {
        # The trailing slash here is vital
        proxy_pass https://127.0.0.1:7777/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support for WebSockets (Terminal & Real-time stats)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Performance settings
        proxy_buffering off;
        gzip off;
    }

}


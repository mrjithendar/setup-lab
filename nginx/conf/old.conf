# -----------------------------
# HTTP → HTTPS redirect
# -----------------------------
server {
    listen 80;
    server_name jithendar.com www.jithendar.com;
    return 301 https://$host$request_uri;
}

# -----------------------------
# HTTPS server
# -----------------------------
server {
    listen 443 ssl http2;
    server_name jithendar.com www.jithendar.com;

    ssl_certificate     /etc/letsencrypt/live/jithendar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jithendar.com/privkey.pem;

    root /var/www/html;
    index index.php index.html;

    # -----------------------------
    # WordPress
    # -----------------------------
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass wordpress-app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    # -----------------------------
    # Security
    # -----------------------------
    location = /xmlrpc.php {
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    client_max_body_size 50M;

    # -----------------------------
    # n8n reverse proxy
    # https://jithendar.com/n8n/
    # -----------------------------
    location /n8n/ {
        proxy_pass http://n8n:5678/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
    }

    # -----------------------------
    # Grafana
    # https://jithendar.com/grafana/
    # -----------------------------
    location /grafana/ {
        proxy_pass http://grafana:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # -----------------------------
    # Prometheus
    # https://jithendar.com/prometheus/
    # -----------------------------
    location /prometheus/ {
        proxy_pass http://prometheus:9090;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
    }

    # -----------------------------
    # Cockpit main UI
    # https://jithendar.com/manage/
    # -----------------------------
    location /manage/ {
        proxy_pass https://host.docker.internal:7777/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_redirect / /manage/;
    }

    # -----------------------------
    # Cockpit static assets
    # -----------------------------
    location /cockpit/ {
        proxy_pass https://host.docker.internal:7777/cockpit/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400;
    }
}

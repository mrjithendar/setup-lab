server {
    listen 443 ssl;
    http2 on;

    server_name jithendar.com www.jithendar.com;

    ssl_certificate     /etc/letsencrypt/live/jithendar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jithendar.com/privkey.pem;

    root /var/www/html;
    index index.php index.html;

    # -----------------------------
    # n8n MUST come FIRST
    # -----------------------------
    location ^~ /n8n/ {
        proxy_pass http://n8n:5678/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
    }

    # -----------------------------
    # WordPress
    # -----------------------------
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass wordpress-app:9000;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME     $fastcgi_script_name;
        fastcgi_param QUERY_STRING    $query_string;
        fastcgi_param REQUEST_METHOD  $request_method;
        fastcgi_param CONTENT_TYPE    $content_type;
        fastcgi_param CONTENT_LENGTH  $content_length;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_param DOCUMENT_URI    $document_uri;
        fastcgi_param DOCUMENT_ROOT   $document_root;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param HTTPS           on;

        fastcgi_read_timeout 300;
    }
}

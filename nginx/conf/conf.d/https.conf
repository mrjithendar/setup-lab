server {
    listen 443 ssl http2;
    server_name jithendar.com www.jithendar.com;

    ssl_certificate     /etc/letsencrypt/live/jithendar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jithendar.com/privkey.pem;

    root /var/www/html;
    index index.php index.html;

    error_page 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # 🔐 Security rules (NO location / here!)
    include /etc/nginx/snippets/security.conf;

    # ✅ ONLY ONE root location
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass wordpress-app:9000;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;

        fastcgi_next_upstream error timeout invalid_header http_500 http_503;
        fastcgi_next_upstream_tries 1;
    }

    location /n8n/ {
        proxy_pass http://n8n:5678;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_intercept_errors on;
    }
}

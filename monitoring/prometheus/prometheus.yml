global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "docker"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "mysql"
    static_configs:
      - targets: ["mysql-exporter:9104"]

  - job_name: prometheus
    metrics_path: '/prometheus/metrics'
    static_configs:
      - targets: ["localhost:9090"]
  
  - job_name: n8n
    static_configs:
      - targets: ["n8n:5678"]
  
  - job_name: "alloy"
    static_configs:
      - targets: ["alloy:12345"]


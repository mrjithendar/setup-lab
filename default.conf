# ============================================================
# WORDPRESS - HTTP
# ============================================================

server {
    listen 80;
    server_name jithendar.com www.jithendar.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ============================================================
# WORDPRESS - HTTPS
# ============================================================

server {
    listen 443 ssl;
    http2 on;

    server_name jithendar.com www.jithendar.com;

    ssl_certificate /etc/letsencrypt/live/jithendar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jithendar.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 128M;

    location / {
        proxy_pass http://wordpress:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-SSL on;

        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }
}


# ============================================================
# N8N - HTTP
# ============================================================

server {
    listen 80;
    server_name n8n.jithendar.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ============================================================
# N8N - HTTPS
# ============================================================

server {
    listen 443 ssl;
    http2 on;

    server_name n8n.jithendar.com;

    ssl_certificate /etc/letsencrypt/live/n8n.jithendar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.jithendar.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50M;

    location / {
        proxy_pass http://n8n:5678;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
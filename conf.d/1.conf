# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name www.jithendar.com jithendar.com;

    include snippets/letsencrypt.conf;
    return 301 https://jithendar.com$request_uri;
}

# Redirect WWW -> NON WWW
server {
    listen 443 ssl http2;
    server_name www.jithendar.com;

    ssl_certificate /etc/letsencrypt/live/jithendar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jithendar.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/jithendar.com/chain.pem;
    include snippets/ssl.conf;

    return 301 https://jithendar.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name jithendar.com;

    root /var/www/html/jithendar.com;
    index index.php;

    # SSL parameters
    ssl_certificate /etc/letsencrypt/live/jithendar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jithendar.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/jithendar.com/chain.pem;
    include snippets/ssl.conf;
    include snippets/letsencrypt.conf;

    # log files
    access_log /var/log/nginx/jithendar.com.access.log;
    error_log /var/log/nginx/jithendar.com.error.log;

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/etc/php-fpm.d/www.conf;
        fastcgi_index   index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires max;
        log_not_found off;
    }

}

# sudo docker-compose up -d #docker
# duso docker-compose down
version: '3.9'
services:
    nginx:
        container_name: nginx
        image: nginxproxy/nginx-proxy
        restart: unless-stopped
        ports:
            - 80:80  # you will need port 80
            - 443:443  # https
        # ports:
        #     - 80:8081
        #     - 443:8082
        volumes:
            - conf:/etc/nginx/conf.d
            - vhost:/etc/nginx/vhost.d
            - html:/usr/share/nginx/html
            - dhparam:/etc/nginx/dhparam
            - certs:/etc/nginx/certs:ro
            - /var/run/docker.sock:/tmp/docker.sock:ro
            - conf:/etc/nginx/conf.d:rw
        # volumes:
        #     - /var/run/docker.sock:/tmp/docker.sock:ro
        #     - /var/docker/nginx/html:/usr/share/nginx/html
        #     - /var/docker/nginx/certs:/etc/nginx/certs
        #     - /var/docker/nginx/vhost:/etc/nginx/vhost.d
        # logging:
        #     options:
                # awslogs-stream: ngix
                # max-size: "10m"
                # max-file: "3"

    ssl:
        depends_on: 
        - nginx
        container_name: ssl
        image: nginxproxy/acme-companion #jrcs/letsencrypt-nginx-proxy-companion
        restart: unless-stopped
        volumes:
            - certs:/etc/nginx/certs:rw
            - acme:/etc/acme.sh
            - /var/run/docker.sock:/var/run/docker.sock:ro
        # volumes_from:
        #     - nginx
        # volumes:
        #     - /var/run/docker.sock:/var/run/docker.sock
        #     - /var/docker/nginx/acme:/etc/acme.sh
        # # nginx volumes: below lines can be commented if SSL wordpress not working
        #     - /var/run/docker.sock:/tmp/docker.sock:ro
        #     - /var/docker/nginx/html:/usr/share/nginx/html
        #     - /var/docker/nginx/certs:/etc/nginx/certs
        #     - /var/docker/nginx/vhost:/etc/nginx/vhost.d
        environment:
        #    NGINX_PROXY_CONTAINER: nginx
           DEFAULT_EMAIL: i@jithendar.com
        # logging:
        #     options:
        #         awslogs-stream: ssl
        
    wordpress:
        image: wordpress
        container_name: ui
        volumes:
            - ./website:/var/www/html
        environment:
            WORDPRESS_DB_HOST: database:3306
            WORDPRESS_DB_USER: website
            WORDPRESS_DB_PASSWORD: password
            WORDPRESS_DB_NAME: website
            VIRTUAL_HOST: techlurn.org
            LETSENCRYPT_HOST: techlurn.org
        depends_on:
            - database
        restart: always
        # logging:
        #     options:
        #         awslogs-stream: wordpress

    database:
        image: mariadb
        container_name: database
        volumes:
            - ./database:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: website
            MYSQL_USER: website
            MYSQL_PASSWORD: password
        restart: unless-stopped
        # logging:
        #     options:
        #         awslogs-stream: mariadb-jithendar
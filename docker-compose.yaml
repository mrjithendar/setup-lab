# sudo docker-compose up -d #docker
# duso docker-compose down
version: '3.3'
services:
    nginx:
        container_name: nginx-jithendar
        image: nginxproxy/nginx-proxy
        restart: unless-stopped
        ports:
            - 80:8081
            - 443:8082
        volumes:
            - /var/run/docker.sock:/tmp/docker.sock:ro
            - /var/docker/nginx/html:/usr/share/nginx/html
            - /var/docker/nginx/certs:/etc/nginx/certs
            - /var/docker/nginx/vhost:/etc/nginx/vhost.d
        # logging:
        #     options:
                # awslogs-stream: ngix-jithendar
                # max-size: "10m"
                # max-file: "3"

    letsencrypt-companion:
        depends_on: 
        - nginx
        container_name: ssl
        image: jrcs/letsencrypt-nginx-proxy-companion
        restart: unless-stopped
        # volumes_from:
        #     - nginx
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - /var/docker/nginx/acme:/etc/acme.sh
            # nginx volumes: below lines can be commented if SSL wordpress not working
            - /var/run/docker.sock:/tmp/docker.sock:ro
            - /var/docker/nginx/html:/usr/share/nginx/html
            - /var/docker/nginx/certs:/etc/nginx/certs
            - /var/docker/nginx/vhost:/etc/nginx/vhost.d
        environment:
            NGINX_PROXY_CONTAINER: nginx
            DEFAULT_EMAIL: contact@jithendar.com
        # logging:
        #     options:
        #         awslogs-stream: letsencrypt-companion-jithendar
        
    website:
        image: wordpress
        container_name: website
        volumes:
            - ./website:/var/www/html
        environment:
            WORDPRESS_DB_HOST: website-db:3306
            WORDPRESS_DB_USER: website
            WORDPRESS_DB_PASSWORD: password
            WORDPRESS_DB_NAME: website
            VIRTUAL_HOST: jithendar.com
            LETSENCRYPT_HOST: jithendar.com
        depends_on:
            - website-db
        restart: unless-stopped
        # logging:
        #     options:
        #         awslogs-stream: wordpress-jithendar

    website-db:
        image: mariadb
        container_name: website-db-jithendar
        volumes:
            - ./website-db:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: website
            MYSQL_USER: website
            MYSQL_PASSWORD: password
        restart: unless-stopped
        # logging:
        #     options:
        #         awslogs-stream: mariadb-jithendar
version: "3.9"
services:
  database:
    image: mysql:latest
    container_name: database
    restart: unless-stopped
    command: '--default-authentication-plugin=mysql_native_password'
    env_file: .env
    environment:
       MYSQL_ROOT_PASSWORD: $MYSQL_ROOT_PASSWORD
       MYSQL_DATABASE: $MYSQL_DB_NAME
       MYSQL_USER: $MYSQL_DB_USER
       MYSQL_PASSWORD: $MYSQL_DB_PASSWORD
    volumes: 
      - dbdata:/var/lib/mysql
  wordpress:
    image: wordpress:latest
    depends_on:
      - database
    container_name: wordpress
    restart: unless-stopped
    volumes:
      - wordpress:/var/www/html
      - ./themes/:/var/www/html/wp-content/themes/
    env_file: .env
    environment: 
      - WORDPRESS_DB_HOST=database
      - WORDPRESS_DB_USER=$MYSQL_DB_USER
      - WORDPRESS_DB_PASSWORD=$MYSQL_DB_PASSWORD
      - WORDPRESS_DB_NAME=$MYSQL_DB_NAME
  nginx:                                                                                        
    depends_on:                                                                                        
        - wordpress                                                                                      
    image: nginx:latest                                                                       
    container_name: nginx                                                                          
    restart: unless-stopped                                                                            
    ports:                                                                                             
        - "80:80"                                                                                        
        - "443:443"                                                                                      
    volumes:                                                                                           
        - wordpress:/var/www/html
        - ./nginx/conf/:/etc/nginx/conf.d
        - ./nginx/conf                                         
        # nginx will need the certificate files certbot will create                                   
        - certbotdata:/etc/letsencrypt                                                                   
    # networks:                                                                                          
    #     - app-network                                                                                                                                                                                 
  certbot:                                                                                             
    depends_on:                                                                                        
        - nginx                                                                                      
    image: certbot/certbot                                                                             
    container_name: certbot                                                                            
    volumes:                                                                                           
    # we save our directory of keys on our host server                                            
    - certbotdata:/etc/letsencrypt                                                                   
    # we bind our wordpress site to the html root                                                 
    - wordpress:/var/www/html                                                                        
    # this command will generate the certificate.                                                   
    # make sure to change your -d and --email flags                                                 
    command: certonly --webroot --webroot-path=/var/www/html --email i@jithendar.com --agree-tos --no-eff-email --force-renewal -d jithendar.com -d www.jithendar.com                                              
                                                                                                    
# add the certbotdata volume down here:                                                             
volumes:                                                                                               
  wordpress:                                                                                           
  dbdata:                                                                                           
  certbotdata:
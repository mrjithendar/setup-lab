version: "3.9"

services:
  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=jithendar.com
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - N8N_PATH=/n8n
      - N8N_EDITOR_BASE_URL=https://jithendar.com/n8n
      - WEBHOOK_URL=https://jithendar.com/n8n
      - N8N_SECURE_COOKIE=true
      - NODE_ENV=production

    volumes:
      - n8n_data:/home/node/.n8n

    networks:
      - wordpress_default

volumes:
  n8n_data:

networks:
  wordpress_default:
    external: true

version: "3.8"

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always
    environment:
      N8N_HOST: jithendar.com
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      # SUBPATH (ALL THREE REQUIRED)
      N8N_PATH: /n8n
      N8N_BASE_PATH: /n8n
      N8N_EDITOR_BASE_URL: https://jithendar.com/n8n
      WEBHOOK_URL: https://jithendar.com/n8n
      N8N_SECURE_COOKIE: "true"
      TZ: Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
    expose:
      - "5678"
    networks:
      - monitoring_net

volumes:
  n8n_data:

networks:
  monitoring_net:
    external: true
    name: monitoring_default
version: "3.9"

services:
  n8n:
    image: n8nio/n8n:2.4.6
    restart: unless-stopped
    container_name: n8n

    environment:
      - N8N_HOST=jithendar.com
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - N8N_PATH=/n8n
      - N8N_EDITOR_BASE_URL=https://jithendar.com/n8n
      - WEBHOOK_URL=https://jithendar.com/n8n
      - N8N_SECURE_COOKIE=true
      - NODE_ENV=production
      - GENERIC_TIMEZONE=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - monitoring_default

volumes:
  n8n_data:

networks:
  monitoring_default:
    external: true
